about_content: | # this will include new lines to allow paragraphs
  Electrical engineer, software developer, and technical leader with 21+ years modernizing TVA's transmission
  asset management and telecommunication systems. I build the systems organizations wish they already had. My 
  career-long pattern is designing practical, maintainable solutions where off-the-shelf tools fall short, from 
  fleet-wide network automation to custom asset-health models.

  I'm currently Program Manager of Transmission Maintenance in the Asset Performance Center, where I serve as
  day-to-day technical lead of our model development team. I also teach as an adjunct professor of electrical
  engineering at the University of Tennessee at Chattanooga.

  That same interest in data and automation led me back to graduate study in computer science and machine 
  learning, complementing two decades of hands-on electrical engineering and telecommunications experience.

  The tools I currently work with most: <mark>Python</mark> <mark>Azure Functions</mark> <mark>MS SQL</mark>
  <mark>Hitachi Lumada/APM</mark> <mark>PowerBI</mark> <mark>Linux/Unix/OSX</mark>

content:
  - title: Major Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        title: Engineering Models — Custom Asset Condition Modeling
        sub_title: TVA Asset Performance Center · 2022 - Present
        description: | # this will include new lines to allow paragraphs
          TVA needed asset-health models its vendor product couldn't provide: <mark>Hitachi Lumada/APM</mark>
          shipped with models for only power transformers, breakers, and substation batteries. I lead the buildout
          of an internal modeling capability covering the rest of the bulk transmission system — at roughly 40% of
          the outsourced cost — and serve as day-to-day technical lead of the development team, which has grown
          from 3 to 5.

          - Shipped production <mark>Python</mark> models for 11+ asset classes: CCVTs, current transformers,
          voltage transformers, combined CT/PT units, transmission lines, transmission line structures, and
          telecom/protection assets (routers, switches, RTUs, DPUs, protective relays).
          - Each asset receives an age score, a design score, and an inspection score; the worst drives overall
          condition — deliberately conservative and explainable. Age scoring is grounded in Weibull survival
          analysis, mapping asset age to probability of failure.
          - Designed an obsolescence scoring framework for telecom asset business planning: vendor support, spare
          parts availability, in-house maintenance capability, SME assessment, and patchability, each generating
          urgency levels and recommendations for planners.
          - Architected the model runtime on <mark>Python-based Azure Functions</mark>: Lumada/APM posts a JSON
          payload of model parameters; the function validates, computes, and returns scored JSON. Built as a
          maintainable framework with schema validation both directions and a template for rapid onboarding of
          new asset types.
          - In-house development saved an estimated 60% versus the original outsourced project cost.


      - layout: left
        title: ETL Pipeline Development
        sub_title: TVA Asset Performance Center
        description: | # this will include new lines to allow paragraphs
          Lumada/APM is only as good as the data feeding it — and TVA's asset data lived scattered across
          enterprise systems. I led the design and implementation of an ETL pipeline (implemented in
          <mark>Python</mark>, <mark>MS SQL</mark>, and C#) integrating data from Maximo, eGIS, Doble, and PowerDB
          into Lumada/APM.

          - The pipeline feeds data for 52,000 assets across 13 asset types, powering both condition models and
          daily APC operations.
          - Created a reusable ingestion framework that reduced the effort required to onboard new asset classes 
          and data sources while keeping transformation logic under direct engineering control.
          - In-house ETL saved an estimated 60% of the original project cost for the same functionality.

      - layout: left
        title: SysAid-APM Ticketing Integration
        sub_title: TVA Asset Performance Center
        description: | # this will include new lines to allow paragraphs
          Helped extend TVA's <mark>SysAid</mark> ticketing system to support asset-condition ticketing alongside
          normal network operations ticketing, including per-device ticket summaries inside Lumada/APM.

          - Gained deep understanding of the <mark>SysAid API</mark> and <mark>PowerBI</mark> dataflows, plus
          Lumada/APM limitations and workarounds.
          - Served on the team rolling out asset condition ticketing to TVA field organizations, building buy-in
          across TVA entities so asset issues feed condition-trend management.

      - layout: left
        title: Modernizing Meter Communications
        sub_title: TVA Transmission
        description: | # this will include new lines to allow paragraphs
          Metering Services and Power Billing needed a stand-alone, low-cost networking solution for simple meter
          interrogation. A capable router equipped with a cellular interface turned out to be the perfect solution.

          - Lead engineer on the initial installation of nearly 1,000 3G cellular routers.
          - Designed and orchestrated the move from the public Internet to a private wireless solution, and from
          3G to 4G cellular.
          - Implemented a zero-touch provisioning (ZTP) system in <mark>Python</mark> for 700 new 4G devices,
          reducing per-device configuration and installation time from hours to minutes.
          - Acted as the liaison between TVA and the device manufacturer to identify, diagnose, and integrate fixes.

      - layout: left
        title: Network Automation and Fleet Orchestration
        sub_title: TVA Transmission
        description: | # this will include new lines to allow paragraphs
          We regularly hit "we need that setting changed across the whole fleet, but our off-the-shelf tool
          doesn't do it." I built the automation that filled that gap — supplementing, not replacing, COTS tools
          like SolarWinds.

          - Built fleet tooling on the open-source network stack: <mark>Netmiko</mark> for multi-vendor SSH,
          <mark>TextFSM/ntc-templates</mark> for structured CLI parsing, and <mark>Nornir</mark> for parallel
          orchestration — including a multithreaded IPsec pre-shared-key rotation utility for the DMVPN cellular
          router fleet.
          - Automation inventories were generated dynamically from Infoblox via a self-built Python API library,
          making the IPAM the single source of truth for every fleet operation.
          - Lead engineer on proof-of-concept, selection, and implementation of <mark>MongoDB</mark> as a fast and
          scalable database for network device information, enabling authoritative asset knowledge for quick and
          accurate compliance and security reporting.

      - layout: left
        title: Open Source — Network Automation Ecosystem
        sub_title: ntc-templates · Netmiko
        description: | # this will include new lines to allow paragraphs
          - Contributed a new TextFSM parsing template (Cisco IOS show ip flow top-talkers) with test fixtures to
          <mark>ntc-templates</mark>, the community-standard CLI parsing library — merged upstream (PR #373, 2019).
          - Developed a custom <mark>Netmiko</mark> driver enabling SSH automation of Siemens/RuggedCom ROS
          substation-hardened switches, integrated into <mark>Nornir</mark> as a custom task plugin and deployed
          extensively in TVA internal automation.

      - layout: left
        title: IP Address Management System Upgrade
        sub_title: TVA Transmission
        description: | # this will include new lines to allow paragraphs
          From spreadsheets to Microsoft Access to BlueCat Proteus, suboptimal IPAM implementations led to
          countless hours discovering and correcting addressing mistakes that could have been avoided.

          - Lead engineer on the transition to <mark>Infoblox DDI</mark>.
          - Cleaned up vast data inaccuracies (~60% to 95+% accuracy) across nearly 8,000 networks containing
          18,000 devices and nearly 25,000 individual host IP addresses.
          - Developed a <mark>Python</mark> library against the Infoblox API to automate initial population,
          continuous data management, and reporting — including a simplified <mark>Django</mark>-powered web
          interface for field personnel.





